<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Sweep Review</title>
<style>
  :root { --bg: #0b1220; --panel: #121b2c; --line: #24324a; --text: #dfe7f3; --dim: #8796ad; --acc: #4f9dff;
    --bad: #ff5d6c; --ok: #3fcf7a; --part: #ffb02e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, Segoe UI, sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 330px 1fr 300px; height: 100vh; }
  aside, #side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #side { border-right: 0; border-left: 1px solid var(--line); overflow-y: auto; padding: 10px 12px; gap: 10px; }
  .hd { padding: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .hd h1 { font-size: 14px; margin: 0; }
  input[type=text], textarea, select { width: 100%; background: #0c1424; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  textarea { resize: vertical; min-height: 70px; }
  #list { overflow-y: auto; flex: 1; }
  .item { padding: 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; gap: 4px; }
  .item:hover { background: #17233a; }
  .item.sel { background: #1d3150; outline: 1px solid var(--acc); }
  .item .top { display: flex; gap: 6px; align-items: baseline; }
  .item .idx { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 32px; }
  .item .key { font-weight: 600; word-break: break-all; flex: 1; }
  .item img { width: 100%; height: auto; border-radius: 4px; background: #000; display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; }
  .chip { font-size: 11px; padding: 1px 5px; border-radius: 9px; background: #26354f; color: #c8d4e6; }
  .chip.c0 { background: #6b1f2a; } .chip.c1 { background: #5b3a10; } .chip.c2 { background: #47401a; } .chip.c3 { background: #2c3550; } .chip.c4 { background: #22404a; }
  .vd { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
  .vd.broken { background: var(--bad); color: #000; } .vd.fine { background: var(--ok); color: #000; } .vd.partial { background: var(--part); color: #000; }
  #main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #view { position: relative; flex: 1; min-height: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #labels { display: none; }
  #hud { position: absolute; left: 10px; top: 8px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #hud .k { font-size: 16px; font-weight: 700; }
  #hud .s { color: var(--dim); }
  #status { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 14px; color: var(--text); pointer-events: none;
    background: rgba(8, 14, 26, .8); padding: 4px 10px; border-radius: 6px; max-width: 90%; }
  #status:empty { display: none; }
  #strip { position: absolute; right: 8px; top: 8px; width: 46%; max-width: 640px; border: 1px solid var(--line); border-radius: 4px; cursor: zoom-in; opacity: .92; background: #000; }
  #strip.big { width: calc(100% - 16px); max-width: none; cursor: zoom-out; opacity: 1; }
  #strip.hide { display: none; }
  #bar { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button { background: #1d2a42; color: var(--text); border: 1px solid #2f4366; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: #26385a; }
  button:disabled { opacity: .35; cursor: default; }
  button.on { background: var(--acc); border-color: var(--acc); color: #000; font-weight: 600; }
  button.vb { width: 100%; text-align: left; padding: 8px 10px; }
  button.vb.broken.on { background: var(--bad); border-color: var(--bad); }
  button.vb.fine.on { background: var(--ok); border-color: var(--ok); }
  button.vb.partial.on { background: var(--part); border-color: var(--part); }
  input[type=range] { flex: 1; min-width: 160px; }
  .lbl { color: var(--dim); font-size: 12px; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  #time { font-variant-numeric: tabular-nums; min-width: 110px; color: var(--dim); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 4px 0 0; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 12px; }
  dt { color: var(--dim); } dd { margin: 0; word-break: break-all; }
  #saved { font-size: 12px; color: var(--dim); }
  .kbd { font-size: 11px; color: var(--dim); }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/addons/" } }
</script>
</head>
<body>
<div id="app">
  <aside>
    <div class="hd">
      <h1>Model sweep review</h1>
      <input id="filter" type="text" placeholder="Filter: key, flag, line, verdict (e.g. t-pose, DW1, unreviewed)">
      <div class="row"><input id="loadKey" type="text" list="allKeys" placeholder="Load any source by key" style="flex:1"><button id="loadBtn">Load</button></div>
      <datalist id="allKeys"></datalist>
      <div class="row"><label class="lbl"><input type="checkbox" id="thumbs" checked> thumbnails</label><span id="count" class="lbl"></span></div>
    </div>
    <div id="list"></div>
  </aside>
  <div id="main">
    <div id="view">
      <div id="labels"></div>
      <div id="hud"><div class="k" id="hudKey"></div><div class="s" id="hudSub"></div></div>
      <div id="status">Loading game scripts</div>
      <img id="strip" class="hide" alt="sweep image">
    </div>
    <div id="bar">
      <div class="row" id="clipRow"></div>
      <div class="row">
        <button id="pause" title="Space">Pause</button>
        <input id="scrub" type="range" min="0" max="1000" value="0">
        <span id="time">0.00 / 0.00 s</span>
        <span class="sep"></span>
        <span class="lbl">speed</span>
        <button class="spd" data-s="0.25">0.25x</button><button class="spd" data-s="0.5">0.5x</button><button class="spd on" data-s="1">1x</button>
        <span class="sep"></span>
        <button id="loop" class="on" title="Repeat one-shot clips">Loop</button>
        <button id="skel" title="S">Skeleton</button>
        <button id="bind" title="B">Bind pose</button>
        <button id="stripBtn" class="on">Sweep image</button>
        <button id="resetCam" title="R">Reset camera</button>
      </div>
    </div>
  </div>
  <div id="side">
    <h2>Verdict</h2>
    <button class="vb broken" data-v="broken">1  True T-pose / broken</button>
    <button class="vb fine" data-v="fine">2  Fine (on purpose)</button>
    <button class="vb partial" data-v="partial">3  Partly animated / some parts frozen</button>
    <textarea id="notes" placeholder="Notes (saved with the verdict; Ctrl+Enter saves)"></textarea>
    <div class="row"><button id="saveNotes">Save notes</button><button id="clearV">Clear verdict</button></div>
    <div id="saved"></div>
    <div class="kbd">Up/Down: next model. 1/2/3: verdict (saves, then moves on). Space: pause. S: skeleton. B: bind pose. I/M/A/P/W: idle, move, attack, special, win.</div>
    <h2>Motion in this clip</h2>
    <div id="motion" class="lbl">-</div>
    <h2>Model</h2>
    <dl id="info"></dl>
    <h2>Sweep</h2>
    <dl id="sweepInfo"></dl>
  </div>
</div>
<!--GAME_SCRIPTS-->
<script type="module" src="/mv/viewer.js"></script>
</body>
</html>
