<!doctype html><html><head><meta charset="utf-8"><title>Model motion regression</title>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<script src="../js/data.js"></script><script src="../js/items.js"></script><script src="../js/sets.js"></script>
<script src="../js/sets/faction-wars.js"></script><script>DT.Sets.activate('faction-wars');</script><script src="../js/models.js"></script></head><body>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {prepareTemplate,disposeSkeletons} from '../js/render3d.js';
const loader=new GLTFLoader();loader.setMeshoptDecoder(MeshoptDecoder);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(300,300);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#354052');scene.add(new THREE.HemisphereLight('#ffffff','#45546d',2.2));
const light=new THREE.DirectionalLight('#fff6e8',2.2);light.position.set(2,3,4);scene.add(light);
const camera=new THREE.PerspectiveCamera(35,1,.01,100);camera.position.set(0,.65,2.3);camera.lookAt(0,.5,0);
window.inspectModel=async (key,file)=>{
 const gltf=await loader.loadAsync('../'+file),authored=gltf.animations.length,src=DT.MODEL_SOURCES[key]||{};
 const template=prepareTemplate(gltf,src),obj=SkeletonUtils.clone(template.root);scene.add(obj);if(src.rotY)obj.rotation.y=src.rotY;
 const bones=[],eyes=[];obj.traverse(o=>{if(o.isBone)bones.push(o);if(o.isMesh)for(const m of [].concat(o.material))if(/eye/i.test(m.name))eyes.push({name:m.name,textured:!!m.map,uv:!!o.geometry.attributes.uv});});
 const clips=[template.clip,...Object.values(template.actions)].filter(Boolean),motion={},pictures=[];
 if(clips.length){const mixer=new THREE.AnimationMixer(obj);
 for(const clip of clips){mixer.stopAllAction();const action=mixer.clipAction(clip).play();mixer.update(0);obj.updateMatrixWorld(true);const start=bones.map(b=>b.quaternion.clone());let moved=0;
  for(const u of [.25,.5,.75]){mixer.setTime(clip.duration*u);obj.updateMatrixWorld(true);moved=Math.max(moved,...bones.map((b,i)=>start[i].angleTo(b.quaternion)));}
  motion[clip.name]=moved;mixer.setTime(clip.duration*(clip.name==='idle'?.25:.5));renderer.render(scene,camera);pictures.push({role:clip.name,image:renderer.domElement.toDataURL('image/png')});action.stop();
 }
 mixer.stopAllAction();mixer.uncacheRoot(obj);}
 scene.remove(obj);disposeSkeletons(obj);
 return {key,file,authored,disabled:src.anim===false,bones:bones.length,motion,eyes,pictures};
};
window.auditReady=true;
</script></body></html>
